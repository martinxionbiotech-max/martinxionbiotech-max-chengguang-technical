site_name: Chengguang Automotive Battery Technical Knowledge Center
site_description: Technical deep-dives on automotive battery technology — SLI, AGM, EFB, manufacturing, testing, and standards
site_url: https://technical.chengguangenergy.com/
repo_url: https://github.com/martinxionbiotech-max/chengguang-technical
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    primary: teal
    accent: amber
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.emoji

plugins:
  - search

nav:
  - Home: index.md
  - Battery Technology:
      - battery-technology/index.md
      - battery-technology/sli.md
      - battery-technology/agm.md
      - battery-technology/efb.md
      - battery-technology/heavy-duty.md
      - battery-technology/vrla.md
  - Battery Components:
      - battery-components/index.md
      - battery-components/lead-grid.md
      - battery-components/separator.md
      - battery-components/electrolyte.md
      - battery-components/battery-case.md
  - Battery Testing:
      - battery-testing/index.md
      - battery-testing/cca.md
      - battery-testing/reserve-capacity.md
      - battery-testing/c20-capacity.md
      - battery-testing/charge-acceptance.md
  - Battery Manufacturing:
      - battery-manufacturing/index.md
      - battery-manufacturing/grid-casting.md
      - battery-manufacturing/plate-pasting.md
      - battery-manufacturing/curing.md
      - battery-manufacturing/formation.md
      - battery-manufacturing/final-testing.md
  - Standards:
      - battery-standards/index.md
      - battery-standards/jis.md
      - battery-standards/din.md
      - battery-standards/bci.md
  - Guides:
      - guides/index.md
